---
- name: Collect Proxmox VM and container inventory
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    local_report_directory: >-
      {{
        report_root
        | default(playbook_dir + '/../../reports/proxmox', true)
      }}

  tasks:
    - name: Create the local report directory
      ansible.builtin.file:
        path: "{{ local_report_directory }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Generate the report timestamp
      ansible.builtin.set_fact:
        report_timestamp: >-
          {{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}

    - name: Collect VM and container information
      ansible.builtin.shell: |
        echo "============================================================"
        echo "PROXMOX VM AND CONTAINER INVENTORY"
        echo "============================================================"
        echo "Inventory host : {{ inventory_hostname }}"
        echo "Generated      : $(date --iso-8601=seconds)"
        echo "Hostname       : $(hostname)"
        echo

        echo "============================================================"
        echo "CLUSTER VM AND CONTAINER RESOURCES"
        echo "============================================================"
        if command -v pvesh >/dev/null 2>&1; then
            pvesh get /cluster/resources \
              --type vm \
              --output-format yaml 2>&1 || true
        else
            echo "[NOT AVAILABLE] pvesh"
        fi
        echo

        echo "============================================================"
        echo "LOCAL QEMU VIRTUAL MACHINES"
        echo "============================================================"
        if command -v qm >/dev/null 2>&1; then
            qm list 2>&1 || true
        else
            echo "[NOT AVAILABLE] qm"
        fi
        echo

        echo "============================================================"
        echo "QEMU VM CONFIGURATION SUMMARY"
        echo "============================================================"
        if command -v qm >/dev/null 2>&1; then
            while read -r vm_id; do
                [[ -n "${vm_id}" ]] || continue

                echo
                echo "------------------------------------------------------------"
                echo "VM ID: ${vm_id}"
                echo "------------------------------------------------------------"

                qm status "${vm_id}" 2>&1 || true

                qm config "${vm_id}" 2>/dev/null |
                  grep -E \
                    '^(name|template|tags|description|cores|sockets|cpu|memory|balloon|numa|machine|bios|ostype|agent|onboot|boot|scsihw|vga|hostpci[0-9]*|net[0-9]*|ide[0-9]*|sata[0-9]*|scsi[0-9]*|virtio[0-9]*|efidisk[0-9]*|tpmstate[0-9]*):' ||
                  true

                echo
                echo "--- Snapshots ---"
                qm listsnapshot "${vm_id}" 2>&1 || true
            done < <(
                qm list 2>/dev/null |
                  awk 'NR > 1 && $1 ~ /^[0-9]+$/ {print $1}'
            )
        fi
        echo

        echo "============================================================"
        echo "LOCAL LXC CONTAINERS"
        echo "============================================================"
        if command -v pct >/dev/null 2>&1; then
            pct list 2>&1 || true
        else
            echo "[NOT AVAILABLE] pct"
        fi
        echo

        echo "============================================================"
        echo "LXC CONTAINER CONFIGURATION SUMMARY"
        echo "============================================================"
        if command -v pct >/dev/null 2>&1; then
            while read -r container_id; do
                [[ -n "${container_id}" ]] || continue

                echo
                echo "------------------------------------------------------------"
                echo "CONTAINER ID: ${container_id}"
                echo "------------------------------------------------------------"

                pct status "${container_id}" 2>&1 || true

                pct config "${container_id}" 2>/dev/null |
                  grep -E \
                    '^(hostname|description|tags|arch|ostype|cores|cpulimit|cpuunits|memory|swap|rootfs|mp[0-9]*|net[0-9]*|features|onboot|startup|unprivileged):' ||
                  true

                echo
                echo "--- Snapshots ---"
                pct listsnapshot "${container_id}" 2>&1 || true
            done < <(
                pct list 2>/dev/null |
                  awk 'NR > 1 && $1 ~ /^[0-9]+$/ {print $1}'
            )
        fi
        echo

        echo "============================================================"
        echo "HIGH AVAILABILITY RESOURCES"
        echo "============================================================"
        if command -v ha-manager >/dev/null 2>&1; then
            ha-manager status 2>&1 || true
            echo
            ha-manager config 2>&1 || true
        else
            echo "[NOT AVAILABLE] ha-manager"
        fi
        echo

        echo "============================================================"
        echo "REPLICATION JOBS"
        echo "============================================================"
        if command -v pvesr >/dev/null 2>&1; then
            pvesr status 2>&1 || true
        else
            echo "[NOT AVAILABLE] pvesr"
        fi
        echo

        echo "============================================================"
        echo "VM AND CONTAINER CONFIGURATION FILE COUNTS"
        echo "============================================================"
        qemu_config_count="$(
          find /etc/pve/qemu-server \
            -maxdepth 1 \
            -type f \
            -name '*.conf' 2>/dev/null |
            wc -l
        )"

        lxc_config_count="$(
          find /etc/pve/lxc \
            -maxdepth 1 \
            -type f \
            -name '*.conf' 2>/dev/null |
            wc -l
        )"

        echo "QEMU configuration files : ${qemu_config_count}"
        echo "LXC configuration files  : ${lxc_config_count}"
        echo

        echo "============================================================"
        echo "END OF REPORT"
        echo "============================================================"
      args:
        executable: /bin/bash
      register: vm_ct_report
      changed_when: false
      failed_when: false

    - name: Save the VM and container report locally
      ansible.builtin.copy:
        content: "{{ vm_ct_report.stdout }}\n"
        dest: >-
          {{
            local_report_directory
          }}/{{ inventory_hostname }}_vm_ct_inventory_{{ report_timestamp }}.txt
        mode: "0640"
      delegate_to: localhost

    - name: Display the saved report path
      ansible.builtin.debug:
        msg: >-
          Report saved to
          {{ local_report_directory }}/{{ inventory_hostname }}_vm_ct_inventory_{{ report_timestamp }}.txt