---
- name: Collect Proxmox Ceph inventory
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    local_report_directory: >-
      {{
        report_root
        | default(playbook_dir + '/../../reports/proxmox', true)
      }}

  tasks:
    - name: Create the local report directory
      ansible.builtin.file:
        path: "{{ local_report_directory }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Generate the report timestamp
      ansible.builtin.set_fact:
        report_timestamp: >-
          {{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}

    - name: Collect Ceph information
      ansible.builtin.shell: |
        echo "============================================================"
        echo "PROXMOX CEPH INVENTORY"
        echo "============================================================"
        echo "Inventory host : {{ inventory_hostname }}"
        echo "Generated      : $(date --iso-8601=seconds)"
        echo "Hostname       : $(hostname)"
        echo

        if ! command -v ceph >/dev/null 2>&1; then
            echo "[NOT AVAILABLE] ceph command"
            exit 0
        fi

        echo "============================================================"
        echo "CEPH STATUS"
        echo "============================================================"
        timeout 30 ceph status 2>&1 || true
        echo

        echo "============================================================"
        echo "CEPH HEALTH DETAILS"
        echo "============================================================"
        timeout 30 ceph health detail 2>&1 || true
        echo

        echo "============================================================"
        echo "CEPH VERSIONS"
        echo "============================================================"
        timeout 30 ceph versions 2>&1 || true
        echo

        echo "============================================================"
        echo "CLUSTER CAPACITY"
        echo "============================================================"
        timeout 30 ceph df detail 2>&1 || true
        echo

        echo "============================================================"
        echo "OSD STATUS"
        echo "============================================================"
        timeout 30 ceph osd stat 2>&1 || true
        echo

        echo "--- OSD tree ---"
        timeout 30 ceph osd tree 2>&1 || true
        echo

        echo "--- OSD capacity tree ---"
        timeout 30 ceph osd df tree 2>&1 || true
        echo

        echo "--- OSD performance ---"
        timeout 30 ceph osd perf 2>&1 || true
        echo

        echo "--- OSD dump and flags ---"
        timeout 30 ceph osd dump 2>&1 || true
        echo

        echo "============================================================"
        echo "CRUSH MAP"
        echo "============================================================"
        timeout 30 ceph osd crush tree 2>&1 || true
        echo

        echo "--- CRUSH rules ---"
        timeout 30 ceph osd crush rule dump 2>&1 || true
        echo

        echo "============================================================"
        echo "POOLS"
        echo "============================================================"
        timeout 30 ceph osd pool ls detail 2>&1 || true
        echo

        echo "============================================================"
        echo "PLACEMENT GROUPS"
        echo "============================================================"
        timeout 30 ceph pg stat 2>&1 || true
        echo

        echo "--- Stuck placement groups ---"
        timeout 30 ceph pg dump_stuck 2>&1 || true
        echo

        echo "============================================================"
        echo "MONITORS AND QUORUM"
        echo "============================================================"
        timeout 30 ceph mon stat 2>&1 || true
        echo

        echo "--- Monitor dump ---"
        timeout 30 ceph mon dump 2>&1 || true
        echo

        echo "--- Quorum status ---"
        timeout 30 ceph quorum_status --format json-pretty 2>&1 || true
        echo

        echo "============================================================"
        echo "MANAGER STATUS"
        echo "============================================================"
        timeout 30 ceph mgr dump 2>&1 || true
        echo

        echo "============================================================"
        echo "CEPH FILESYSTEM STATUS"
        echo "============================================================"
        timeout 30 ceph fs status 2>&1 || true
        echo

        echo "============================================================"
        echo "CEPH DEVICE INVENTORY"
        echo "============================================================"
        timeout 30 ceph device ls 2>&1 || true
        echo

        echo "--- Ceph Volume LVM inventory ---"
        if command -v ceph-volume >/dev/null 2>&1; then
            timeout 30 ceph-volume lvm list 2>&1 || true
        else
            echo "[NOT AVAILABLE] ceph-volume"
        fi
        echo

        echo "============================================================"
        echo "CEPH CRASH REPORTS"
        echo "============================================================"
        timeout 30 ceph crash ls 2>&1 || true
        echo

        echo "============================================================"
        echo "CEPH CONFIGURATION"
        echo "============================================================"
        if [[ -r /etc/pve/ceph.conf ]]; then
            cat /etc/pve/ceph.conf 2>&1 || true
        elif [[ -r /etc/ceph/ceph.conf ]]; then
            cat /etc/ceph/ceph.conf 2>&1 || true
        else
            echo "[NOT AVAILABLE] Ceph configuration file"
        fi
        echo

        echo "============================================================"
        echo "LOCAL CEPH SERVICES"
        echo "============================================================"
        systemctl list-units \
          'ceph*.service' \
          'ceph*.target' \
          --all \
          --no-pager 2>&1 || true
        echo

        echo "============================================================"
        echo "RECENT CEPH WARNINGS AND ERRORS"
        echo "============================================================"
        journalctl \
          --boot \
          --unit='ceph*.service' \
          --priority=warning \
          --no-pager \
          --lines=200 2>&1 || true
        echo

        echo "============================================================"
        echo "END OF REPORT"
        echo "============================================================"
      args:
        executable: /bin/bash
      register: ceph_report
      changed_when: false
      failed_when: false

    - name: Save the Ceph report locally
      ansible.builtin.copy:
        content: "{{ ceph_report.stdout }}\n"
        dest: >-
          {{
            local_report_directory
          }}/{{ inventory_hostname }}_ceph_{{ report_timestamp }}.txt
        mode: "0640"
      delegate_to: localhost

    - name: Display the saved report path
      ansible.builtin.debug:
        msg: >-
          Report saved to
          {{ local_report_directory }}/{{ inventory_hostname }}_ceph_{{ report_timestamp }}.txt