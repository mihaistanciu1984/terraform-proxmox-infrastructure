---
- name: Collect Proxmox services inventory
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    local_report_directory: >-
      {{
        report_root
        | default(playbook_dir + '/../../reports/proxmox', true)
      }}

  tasks:
    - name: Create the local report directory
      ansible.builtin.file:
        path: "{{ local_report_directory }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Generate the report timestamp
      ansible.builtin.set_fact:
        report_timestamp: >-
          {{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}

    - name: Collect service information
      ansible.builtin.shell: |
        echo "============================================================"
        echo "PROXMOX SERVICES INVENTORY"
        echo "============================================================"
        echo "Inventory host : {{ inventory_hostname }}"
        echo "Generated      : $(date --iso-8601=seconds)"
        echo "Hostname       : $(hostname)"
        echo

        echo "============================================================"
        echo "FAILED SERVICES"
        echo "============================================================"
        systemctl --failed --no-pager 2>&1 || true
        echo

        echo "============================================================"
        echo "RUNNING SERVICES"
        echo "============================================================"
        systemctl list-units \
          --type=service \
          --state=running \
          --no-pager \
          --no-legend 2>&1 || true
        echo

        echo "============================================================"
        echo "PROXMOX SERVICE STATUS"
        echo "============================================================"

        services=(
          pve-cluster
          pvedaemon
          pveproxy
          pvestatd
          pvescheduler
          pve-firewall
          pve-ha-lrm
          pve-ha-crm
          corosync
          ssh
          chrony
          chronyd
          systemd-timesyncd
          qmeventd
          spiceproxy
          watchdog-mux
          ceph-mon.target
          ceph-mgr.target
          ceph-osd.target
        )

        for service_name in "${services[@]}"; do
            if systemctl list-unit-files "${service_name}.service" \
              "${service_name}" --no-legend 2>/dev/null |
              grep -q .
            then
                active_state="$(
                  systemctl is-active "${service_name}" 2>/dev/null ||
                  true
                )"

                enabled_state="$(
                  systemctl is-enabled "${service_name}" 2>/dev/null ||
                  true
                )"

                printf '%-28s active=%-12s enabled=%s\n' \
                  "${service_name}" \
                  "${active_state:-unknown}" \
                  "${enabled_state:-unknown}"
            fi
        done
        echo

        echo "============================================================"
        echo "PROXMOX PROCESS LIST"
        echo "============================================================"
        ps -eo \
          pid,ppid,user,stat,%cpu,%mem,etimes,comm,args \
          --sort=-%cpu 2>&1 |
          head -n 80 || true
        echo

        echo "============================================================"
        echo "SYSTEMD TIMERS"
        echo "============================================================"
        systemctl list-timers \
          --all \
          --no-pager 2>&1 || true
        echo

        echo "============================================================"
        echo "SERVICE RESTART COUNTERS"
        echo "============================================================"
        for service_name in \
          pve-cluster \
          pvedaemon \
          pveproxy \
          pvestatd \
          corosync \
          ssh
        do
            if systemctl show "${service_name}" \
              --property=Id >/dev/null 2>&1
            then
                echo "--- ${service_name} ---"
                systemctl show "${service_name}" \
                  --property=ActiveState \
                  --property=SubState \
                  --property=Result \
                  --property=NRestarts \
                  --property=ExecMainStartTimestamp \
                  --property=MemoryCurrent \
                  --property=CPUUsageNSec \
                  2>&1 || true
                echo
            fi
        done

        echo "============================================================"
        echo "RECENT WARNING AND ERROR EVENTS"
        echo "============================================================"
        journalctl \
          --boot \
          --priority=warning \
          --no-pager \
          --lines=200 2>&1 || true
        echo

        echo "============================================================"
        echo "RECENT PROXMOX SERVICE EVENTS"
        echo "============================================================"
        journalctl \
          --boot \
          --unit=pve-cluster \
          --unit=pvedaemon \
          --unit=pveproxy \
          --unit=pvestatd \
          --unit=corosync \
          --no-pager \
          --lines=200 2>&1 || true
        echo

        echo "============================================================"
        echo "END OF REPORT"
        echo "============================================================"
      args:
        executable: /bin/bash
      register: services_report
      changed_when: false
      failed_when: false

    - name: Save the services report locally
      ansible.builtin.copy:
        content: "{{ services_report.stdout }}\n"
        dest: >-
          {{
            local_report_directory
          }}/{{ inventory_hostname }}_services_{{ report_timestamp }}.txt
        mode: "0640"
      delegate_to: localhost

    - name: Display the saved report path
      ansible.builtin.debug:
        msg: >-
          Report saved to
          {{ local_report_directory }}/{{ inventory_hostname }}_services_{{ report_timestamp }}.txt