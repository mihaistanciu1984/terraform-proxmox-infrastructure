---
- name: Collect Proxmox PCI GPU and IOMMU inventory
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    local_report_directory: >-
      {{
        report_root
        | default(playbook_dir + '/../../reports/proxmox', true)
      }}

  tasks:
    - name: Create the local report directory
      ansible.builtin.file:
        path: "{{ local_report_directory }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Generate the report timestamp
      ansible.builtin.set_fact:
        report_timestamp: >-
          {{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}

    - name: Collect PCI GPU and IOMMU information
      ansible.builtin.shell: |
        echo "============================================================"
        echo "PROXMOX PCI, GPU AND IOMMU INVENTORY"
        echo "============================================================"
        echo "Inventory host : {{ inventory_hostname }}"
        echo "Generated      : $(date --iso-8601=seconds)"
        echo "Hostname       : $(hostname)"
        echo

        echo "============================================================"
        echo "PCI DEVICES"
        echo "============================================================"
        if command -v lspci >/dev/null 2>&1; then
            lspci -nn 2>&1 || true
        else
            echo "[NOT AVAILABLE] lspci"
        fi
        echo

        echo "============================================================"
        echo "PCI DEVICES AND KERNEL DRIVERS"
        echo "============================================================"
        if command -v lspci >/dev/null 2>&1; then
            lspci -nnk 2>&1 || true
        else
            echo "[NOT AVAILABLE] lspci"
        fi
        echo

        echo "============================================================"
        echo "GPU AND AUDIO DEVICES"
        echo "============================================================"
        if command -v lspci >/dev/null 2>&1; then
            lspci -nnk |
              grep -A 3 -Ei 'VGA|3D|Display|Audio' 2>&1 || true
        else
            echo "[NOT AVAILABLE] lspci"
        fi
        echo

        echo "============================================================"
        echo "STORAGE AND NETWORK CONTROLLERS"
        echo "============================================================"
        if command -v lspci >/dev/null 2>&1; then
            lspci -nnk |
              grep -A 3 -Ei \
                'Ethernet|Network|SATA|SAS|RAID|NVMe|Fibre Channel' \
                2>&1 || true
        else
            echo "[NOT AVAILABLE] lspci"
        fi
        echo

        echo "============================================================"
        echo "KERNEL COMMAND LINE"
        echo "============================================================"
        cat /proc/cmdline 2>&1 || true
        echo

        echo "============================================================"
        echo "IOMMU KERNEL MESSAGES"
        echo "============================================================"
        dmesg 2>/dev/null |
          grep -Ei 'DMAR|IOMMU|AMD-Vi|remapping' || \
          echo "[INFO] No IOMMU messages were detected."
        echo

        echo "============================================================"
        echo "IOMMU GROUPS"
        echo "============================================================"
        if compgen -G "/sys/kernel/iommu_groups/*/devices/*" >/dev/null; then
            for device_path in /sys/kernel/iommu_groups/*/devices/*; do
                group_name="$(basename "$(dirname "$(dirname "${device_path}")")")"
                pci_address="$(basename "${device_path}")"

                if command -v lspci >/dev/null 2>&1; then
                    device_description="$(lspci -nns "${pci_address}" 2>/dev/null)"
                else
                    device_description="${pci_address}"
                fi

                echo "Group ${group_name}: ${device_description}"
            done | sort -V
        else
            echo "[INFO] No IOMMU groups were detected."
        fi
        echo

        echo "============================================================"
        echo "VFIO KERNEL MODULES"
        echo "============================================================"
        lsmod |
          grep -E '^vfio|^kvm' 2>&1 || \
          echo "[INFO] No VFIO modules are currently loaded."
        echo

        echo "--- Configured VFIO module files ---"
        grep -RHiE \
          'vfio|iommu|ids=' \
          /etc/modprobe.d \
          /etc/modules \
          /etc/modules-load.d 2>/dev/null || \
          echo "[INFO] No VFIO configuration entries were detected."
        echo

        echo "============================================================"
        echo "NVIDIA GPU STATUS"
        echo "============================================================"
        if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi 2>&1 || true
        else
            echo "[NOT AVAILABLE] nvidia-smi"
        fi
        echo

        echo "============================================================"
        echo "AMD GPU STATUS"
        echo "============================================================"
        if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi 2>&1 || true
        else
            echo "[NOT AVAILABLE] rocm-smi"
        fi
        echo

        echo "============================================================"
        echo "VM PCI PASSTHROUGH CONFIGURATION"
        echo "============================================================"
        grep -RHn '^hostpci[0-9]*:' \
          /etc/pve/qemu-server 2>/dev/null || \
          echo "[INFO] No VM hostpci entries were detected."
        echo

        echo "============================================================"
        echo "END OF REPORT"
        echo "============================================================"
      args:
        executable: /bin/bash
      register: pci_gpu_iommu_report
      changed_when: false
      failed_when: false

    - name: Save the PCI GPU and IOMMU report locally
      ansible.builtin.copy:
        content: "{{ pci_gpu_iommu_report.stdout }}\n"
        dest: >-
          {{
            local_report_directory
          }}/{{ inventory_hostname }}_pci_gpu_iommu_{{ report_timestamp }}.txt
        mode: "0640"
      delegate_to: localhost

    - name: Display the saved report path
      ansible.builtin.debug:
        msg: >-
          Report saved to
          {{ local_report_directory }}/{{ inventory_hostname }}_pci_gpu_iommu_{{ report_timestamp }}.txt