---
- name: Collect Proxmox hardware and BIOS inventory
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    local_report_directory: >-
      {{
        report_root
        | default(playbook_dir + '/../../reports/proxmox', true)
      }}

  tasks:
    - name: Create the local report directory
      ansible.builtin.file:
        path: "{{ local_report_directory }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Generate the report timestamp
      ansible.builtin.set_fact:
        report_timestamp: >-
          {{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}

    - name: Collect hardware and BIOS information
      ansible.builtin.shell: |
        echo "============================================================"
        echo "PROXMOX HARDWARE AND BIOS INVENTORY"
        echo "============================================================"
        echo "Inventory host : {{ inventory_hostname }}"
        echo "Generated      : $(date --iso-8601=seconds)"
        echo "Hostname       : $(hostname)"
        echo

        echo "============================================================"
        echo "SYSTEM SUMMARY"
        echo "============================================================"
        hostnamectl 2>&1 || true
        echo

        echo "--- Kernel ---"
        uname -a 2>&1 || true
        echo

        echo "--- Uptime ---"
        uptime 2>&1 || true
        echo

        echo "--- Virtualization detection ---"
        systemd-detect-virt 2>&1 || true
        echo

        echo "============================================================"
        echo "SYSTEM DMI INFORMATION"
        echo "============================================================"
        if command -v dmidecode >/dev/null 2>&1; then
            dmidecode --type system 2>&1 || true
        else
            echo "[NOT AVAILABLE] dmidecode"
        fi
        echo

        echo "============================================================"
        echo "BIOS INFORMATION"
        echo "============================================================"
        if command -v dmidecode >/dev/null 2>&1; then
            dmidecode --type bios 2>&1 || true
        else
            echo "[NOT AVAILABLE] dmidecode"
        fi
        echo

        echo "============================================================"
        echo "BASEBOARD INFORMATION"
        echo "============================================================"
        if command -v dmidecode >/dev/null 2>&1; then
            dmidecode --type baseboard 2>&1 || true
        else
            echo "[NOT AVAILABLE] dmidecode"
        fi
        echo

        echo "============================================================"
        echo "CHASSIS INFORMATION"
        echo "============================================================"
        if command -v dmidecode >/dev/null 2>&1; then
            dmidecode --type chassis 2>&1 || true
        else
            echo "[NOT AVAILABLE] dmidecode"
        fi
        echo

        echo "============================================================"
        echo "SHORT HARDWARE LIST"
        echo "============================================================"
        if command -v lshw >/dev/null 2>&1; then
            lshw -short 2>&1 || true
        else
            echo "[NOT AVAILABLE] lshw"
        fi
        echo

        echo "============================================================"
        echo "IPMI CONTROLLER"
        echo "============================================================"
        if command -v ipmitool >/dev/null 2>&1; then
            ipmitool mc info 2>&1 || true
        else
            echo "[NOT AVAILABLE] ipmitool"
        fi
        echo

        echo "============================================================"
        echo "END OF REPORT"
        echo "============================================================"
      args:
        executable: /bin/bash
      register: hardware_bios_report
      changed_when: false
      failed_when: false

    - name: Save the hardware and BIOS report locally
      ansible.builtin.copy:
        content: "{{ hardware_bios_report.stdout }}\n"
        dest: >-
          {{
            local_report_directory
          }}/{{ inventory_hostname }}_hardware_bios_{{ report_timestamp }}.txt
        mode: "0640"
      delegate_to: localhost

    - name: Display the saved report path
      ansible.builtin.debug:
        msg: >-
          Report saved to
          {{ local_report_directory }}/{{ inventory_hostname }}_hardware_bios_{{ report_timestamp }}.txt