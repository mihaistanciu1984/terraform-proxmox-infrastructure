---
- name: Collect operating system and Proxmox inventory
  hosts: proxmox_hosts
  gather_facts: false

  vars:
    local_report_directory: >-
      {{
        report_root
        | default(playbook_dir + '/../../reports/proxmox', true)
      }}

  tasks:
    - name: Create the local report directory
      ansible.builtin.file:
        path: "{{ local_report_directory }}"
        state: directory
        mode: "0750"
      delegate_to: localhost
      run_once: true

    - name: Generate the report timestamp
      ansible.builtin.set_fact:
        report_timestamp: >-
          {{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}

    - name: Collect operating system and Proxmox information
      ansible.builtin.shell: |
        echo "============================================================"
        echo "OPERATING SYSTEM AND PROXMOX INVENTORY"
        echo "============================================================"
        echo "Inventory host : {{ inventory_hostname }}"
        echo "Generated      : $(date --iso-8601=seconds)"
        echo "Hostname       : $(hostname)"
        echo

        echo "============================================================"
        echo "OPERATING SYSTEM"
        echo "============================================================"
        if [[ -r /etc/os-release ]]; then
            cat /etc/os-release 2>&1 || true
        fi
        echo

        echo "--- Debian version ---"
        cat /etc/debian_version 2>&1 || true
        echo

        echo "--- Hostname information ---"
        hostnamectl 2>&1 || true
        echo

        echo "============================================================"
        echo "KERNEL"
        echo "============================================================"
        uname -a 2>&1 || true
        echo

        echo "--- Installed kernels ---"
        dpkg-query -W \
          -f='${Package}\t${Version}\t${Status}\n' \
          'proxmox-kernel-*' \
          'pve-kernel-*' 2>/dev/null || true
        echo

        echo "--- Loaded kernel modules count ---"
        echo "Loaded modules: $(lsmod 2>/dev/null | tail -n +2 | wc -l)"
        echo

        echo "============================================================"
        echo "PROXMOX VERSION"
        echo "============================================================"
        if command -v pveversion >/dev/null 2>&1; then
            pveversion --verbose 2>&1 || true
        else
            echo "[NOT AVAILABLE] pveversion"
        fi
        echo

        echo "============================================================"
        echo "IMPORTANT PROXMOX PACKAGES"
        echo "============================================================"
        dpkg-query -W \
          -f='${Package}\t${Version}\t${Status}\n' \
          'proxmox-ve' \
          'pve-*' \
          'qemu-server' \
          'qemu-system-*' \
          'libpve-*' \
          'lxc-*' \
          'corosync' \
          'ceph*' 2>/dev/null |
          sort -u || true
        echo

        echo "============================================================"
        echo "BOOT CONFIGURATION"
        echo "============================================================"
        echo "--- Kernel command line ---"
        cat /proc/cmdline 2>&1 || true
        echo

        echo "--- Proxmox boot tool status ---"
        if command -v proxmox-boot-tool >/dev/null 2>&1; then
            proxmox-boot-tool status 2>&1 || true
        else
            echo "[NOT AVAILABLE] proxmox-boot-tool"
        fi
        echo

        echo "--- EFI boot entries ---"
        if command -v efibootmgr >/dev/null 2>&1; then
            efibootmgr -v 2>&1 || true
        else
            echo "[NOT AVAILABLE] efibootmgr"
        fi
        echo

        echo "--- Secure Boot status ---"
        if command -v mokutil >/dev/null 2>&1; then
            mokutil --sb-state 2>&1 || true
        else
            echo "[NOT AVAILABLE] mokutil"
        fi
        echo

        echo "============================================================"
        echo "SYSTEM TIME"
        echo "============================================================"
        timedatectl status 2>&1 || true
        echo

        if command -v chronyc >/dev/null 2>&1; then
            echo "--- Chrony tracking ---"
            chronyc tracking 2>&1 || true
            echo
            echo "--- Chrony sources ---"
            chronyc sources -v 2>&1 || true
        fi
        echo

        echo "============================================================"
        echo "SYSTEM LOAD AND UPTIME"
        echo "============================================================"
        uptime 2>&1 || true
        echo

        echo "--- Load averages ---"
        cat /proc/loadavg 2>&1 || true
        echo

        echo "============================================================"
        echo "DEFAULT SYSTEM TARGET"
        echo "============================================================"
        systemctl get-default 2>&1 || true
        echo

        echo "============================================================"
        echo "APT SOURCE FILES"
        echo "============================================================"
        find /etc/apt \
          -maxdepth 2 \
          -type f \
          \( -name '*.list' -o -name '*.sources' \) \
          -print 2>/dev/null |
          sort || true
        echo

        echo "============================================================"
        echo "UPGRADABLE PACKAGES FROM LOCAL APT CACHE"
        echo "============================================================"
        apt list --upgradable 2>/dev/null || true
        echo

        echo "============================================================"
        echo "END OF REPORT"
        echo "============================================================"
      args:
        executable: /bin/bash
      register: os_proxmox_report
      changed_when: false
      failed_when: false

    - name: Save the operating system and Proxmox report locally
      ansible.builtin.copy:
        content: "{{ os_proxmox_report.stdout }}\n"
        dest: >-
          {{
            local_report_directory
          }}/{{ inventory_hostname }}_os_proxmox_{{ report_timestamp }}.txt
        mode: "0640"
      delegate_to: localhost

    - name: Display the saved report path
      ansible.builtin.debug:
        msg: >-
          Report saved to
          {{ local_report_directory }}/{{ inventory_hostname }}_os_proxmox_{{ report_timestamp }}.txt